name: Ξένες μετοχές

# Κάθε ώρα: τιμές των ξένων μετοχών που υπάρχουν σε χαρτοφυλάκια,
# μία φορά την εβδομάδα: λίστα συμβόλων και ιστορικό.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-foreign
  cancel-in-progress: false

jobs:
  foreign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Τιμές ξένων μετοχών
        run: python scripts/fetch_foreign.py
      - name: Αποθήκευση
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A foreign.json universe.json hist 2>/dev/null || true
          if git diff --cached --quiet; then echo "Καμία αλλαγή."; exit 0; fi
          git commit -qm "Ξένες μετοχές $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q && exit 0
            sleep 15
          done
          exit 1

name: Crypto (CoinMarketCap)

# Τα 500 μεγαλύτερα crypto από το CoinMarketCap API.
# Κάθε εκτέλεση μένει ανοιχτή ~14 λεπτά και ανανεώνει το Firestore (site/crypto)
# όσο συχνά επιτρέπει το πρόγραμμα του κλειδιού CMC_API_KEY.
# Κάθε 4 ώρες αποθηκεύει και το crypto.json / cspark.json στο repo (μίνι διαγράμματα 7 ημερών).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-crypto
  cancel-in-progress: false

jobs:
  crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests firebase-admin
      - name: CoinMarketCap → Firestore
        run: python scripts/fetch_cmc.py
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
      - name: Αποθήκευση μίνι διαγραμμάτων
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cspark.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Καμία αλλαγή στα μίνι διαγράμματα."; exit 0; fi
          git add crypto.json
          git commit -qm "Crypto $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q && exit 0
            sleep 15
          done
          exit 1

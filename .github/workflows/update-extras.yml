name: Θεμελιώδη, μερίσματα, ειδήσεις

# Τρεις φορές την ημέρα (Δευτέρα-Παρασκευή): πριν το άνοιγμα, μεσημέρι, μετά το κλείσιμο.
on:
  schedule:
    - cron: "40 5,10,15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-extras
  cancel-in-progress: false

jobs:
  extras:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Συλλογή στοιχείων
        run: python scripts/fetch_extras.py
      - name: Αποθήκευση
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extras.json
          if git diff --cached --quiet; then echo "Καμία αλλαγή."; exit 0; fi
          git commit -qm "Θεμελιώδη/ειδήσεις $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q && exit 0
            sleep 15
          done
          exit 1

name: Ειδοποιήσεις

# Κάθε 10 λεπτά: ειδοποιήσεις τιμών (και ό,τι ζήτησε ο χρήστης από το site, π.χ. δοκιμαστική σύνοψη).
# Παρασκευή 15:45 UTC (17:45 ώρα Ελλάδας το χειμώνα): εβδομαδιαία σύνοψη στο email.
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "45 15 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        description: "alerts ή weekly"
        default: alerts

permissions:
  contents: read
  actions: write

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-notify.txt
      - run: pip install -q -r scripts/requirements-notify.txt
      - name: Ειδοποιήσεις
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
          GH_TOKEN: ${{ github.token }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event.schedule }}" = "45 15 * * 5" ]; then MODE=weekly; fi
          python scripts/notify.py "${MODE:-alerts}"

name: Λογότυπα μετοχών

on:
  schedule:
    - cron: "5 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fetch_logos.py
      - name: Αποθήκευση
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Καμία αλλαγή."; exit 0; fi
          git commit -qm "Λογότυπα μετοχών"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q && exit 0
            sleep 15
          done
          exit 1

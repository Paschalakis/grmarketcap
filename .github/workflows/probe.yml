name: probe
on: { push: { branches: [probe], paths: [probe/probe.py] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python probe/probe.py > probe/out.txt 2>&1 || true
      - run: git config user.name bot && git config user.email b@x && git add probe/out.txt && git commit -qm out && git push -q

name: probe
on: { push: { branches: [probe], paths: [probe/probe.py, probe/tv.js] } }
permissions: { contents: write, actions: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.0 && npx playwright install --with-deps chromium
      - run: pip install -q firebase-admin google-auth
      - run: python3 probe/probe.py > probe/out.txt 2>&1 || true
        env: { GH_TOKEN: "${{ github.token }}", FIREBASE_SA: "${{ secrets.FIREBASE_SA }}", GMAIL_USER: "${{ secrets.GMAIL_USER }}" }
      - run: git config user.name Claude && git config user.email noreply@anthropic.com && git add probe && git commit -qm out && git push -q
